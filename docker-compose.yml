# MySQL para rodar a aplicacao com o perfil "mysql".
#
#   docker compose up -d
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
#
# O perfil padrao da aplicacao usa H2 em memoria e nao precisa deste arquivo.
services:
  mysql:
    image: mysql:8.4
    container_name: barbearia-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bdbarbearia
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-barbearia}
    ports:
      - "3306:3306"
    volumes:
      - mysql-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-barbearia}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-dados:
