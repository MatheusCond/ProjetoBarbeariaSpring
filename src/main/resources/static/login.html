<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar — Barbearia Conde</title>
    <link rel="icon" href="imgs/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/api.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/login.js" defer></script>
</head>

<body>
<main class="auth">
    <aside class="auth-arte" style="background-image: url('imgs/cut.jpg')">
        <a class="marca" href="index.html">
            <img src="imgs/logo.jpg" alt="Brasão da Barbearia Conde">
            <span class="marca-texto">
                <span class="marca-nome">Conde</span>
                <span class="marca-sub">Barbearia</span>
            </span>
        </a>
        <div class="auth-arte-texto">
            <h2>Sua cadeira está reservada</h2>
            <p>Entre para ver seus agendamentos, remarcar ou reservar um novo horário.</p>
            <ul class="auth-lista" id="vantagens"></ul>
        </div>
    </aside>

    <section class="auth-painel">
        <div class="auth-caixa">
            <a class="auth-voltar" href="index.html" id="voltar">Voltar ao site</a>

            <header>
                <h1>Entrar</h1>
                <p>Use o e-mail cadastrado na barbearia.</p>
            </header>

            <div id="mensagemErro" class="alerta alerta--erro" hidden></div>

            <form id="formLogin" class="auth-form" novalidate>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email"
                           placeholder="voce@exemplo.com" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha"
                           autocomplete="current-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn--ouro btn--bloco">Entrar</button>
            </form>

            <p class="auth-rodape">
                Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
            </p>
        </div>
    </section>
</main>
</body>

</html>
