<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro - Barbearia Conde</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="css/agenda.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
    <script src="js/api.js" defer></script>
    <script src="js/cadastro.js" defer></script>
</head>
<body>
<header>
    <div id="box">
        <nav>
            <h1><img src="imgs/logoBarbearia.jpg" alt="Logo da Barbearia Conde"></h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <section class="register">
        <h1>Cadastro</h1>
        <div id="mensagemErro" class="caixa-aviso erro" style="display: none;"></div>
        <form id="formCadastro" novalidate>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" autocomplete="name" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="senha">Senha (mínimo 8 caracteres):</label>
            <input type="password" id="senha" name="senha" autocomplete="new-password"
                   minlength="8" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(17) 99999-9999"
                   autocomplete="tel" required>

            <label for="endereco">Endereço (opcional):</label>
            <input type="text" id="endereco" name="endereco" autocomplete="street-address">

            <button type="submit">Cadastrar</button>
            <h3>Já tem conta? <a href="login.html">Entrar</a></h3>
        </form>
    </section>
</main>

<footer>
    <p class="copyright">&copy; 2024 Conde Barbearia. Todos os direitos reservados.</p>
</footer>
</body>
</html>
